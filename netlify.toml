[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

# Mantém a tabela BigQuery de vento forte/muito-forte atualizada com dados novos (o backfill em
# scripts/backfill-wind-events.js só cobre até o momento em que rodou) — não depende de ninguém
# estar com o site aberto no navegador. Ver netlify/functions/wind-events-sync.js.
[functions."wind-events-sync"]
  schedule = "*/15 * * * *"

# Headers para resolver problemas de CORS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para API
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Chuva em tempo real: proxy com cache curto na borda (20s) em vez de redirect direto sem
# cache — evita que todo carregamento de página espere do zero a resposta lenta da Prefeitura.
# Ver netlify/functions/rain-realtime.js para o porquê.
[[redirects]]
  from = "/api/json/chuvas"
  to = "/.netlify/functions/rain-realtime"
  status = 200
  force = true

# Dados históricos de chuvas (BigQuery via Netlify Function)
[[redirects]]
  from = "/api/historical-rain"
  to = "/.netlify/functions/historical-rain"
  status = 200
  force = true

# Histórico de vento forte/muito-forte (BigQuery via Netlify Function) — mesma tabela alimentada
# por scripts/backfill-wind-events.js e wind-events-sync.js. Ver netlify/functions/wind-events-history.js.
[[redirects]]
  from = "/api/wind-events-history"
  to = "/.netlify/functions/wind-events-history"
  status = 200
  force = true

# Vento em aeroportos (REDEMET via Netlify Function — esconde a API key)
[[redirects]]
  from = "/api/redemet-wind"
  to = "/.netlify/functions/redemet-wind"
  status = 200
  force = true

# Ocorrências históricas (API Hexagon) via Netlify Function — esconde IP/usuário/senha, que antes
# ficavam em variáveis VITE_* (embutidas no bundle público). Ver netlify/functions/ocorrencias-hexagon.js.
[[redirects]]
  from = "/api/ocorrencias-hexagon"
  to = "/.netlify/functions/ocorrencias-hexagon"
  status = 200
  force = true

# Vento em estações automáticas (INMET) — proxy simples, API pública sem credenciais
[[redirects]]
  from = "/api/inmet/*"
  to = "https://apitempo.inmet.gov.br/:splat"
  status = 200
  force = true

# Ocorrências abertas em tempo real (Simaa) — proxy simples, API pública sem credenciais.
# Sem isso, o browser chamava apisimaa.computei.srv.br direto em produção e era bloqueado por CORS
# (só funcionava em dev, via proxy do Vite em vite.config.ts).
[[redirects]]
  from = "/api/ocorrencias-abertas/*"
  to = "https://apisimaa.computei.srv.br/:splat"
  status = 200
  force = true

# --- API pública v1 (uso por outros projetos) ---

# Histórico de chuvas (alias estável para a mesma function de /api/historical-rain)
[[redirects]]
  from = "/api/v1/rain/historical"
  to = "/.netlify/functions/historical-rain"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/rain"
  to = "/.netlify/functions/v1-rain"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/wind"
  to = "/.netlify/functions/v1-wind"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/radar"
  to = "/.netlify/functions/v1-radar"
  status = 200
  force = true

# Fallback para SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"
