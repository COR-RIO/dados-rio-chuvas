name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_HOST: 35.226.102.32
  DEPLOY_USER: cor
  DEPLOY_PATH: /home/cor/dados-rio-chuvas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sincronizar arquivos com o servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.env' --exclude 'dist' --exclude 'credentials' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Escrever .env no servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cat > $DEPLOY_PATH/.env" <<EOF
          NODE_ENV=production
          PORT=3000
          GOOGLE_APPLICATION_CREDENTIALS=$DEPLOY_PATH/credentials/credentials.json
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          OCORRENCIAS_API_BASE_URL=${{ secrets.OCORRENCIAS_API_BASE_URL }}
          OCORRENCIAS_API_USERNAME=${{ secrets.OCORRENCIAS_API_USERNAME }}
          OCORRENCIAS_API_PASSWORD=${{ secrets.OCORRENCIAS_API_PASSWORD }}
          VITE_GEOCODE_OCORRENCIAS=true
          VITE_OCORRENCIAS_PLANILHA_URL=planilhas/ocorrencias.xlsx
          REDEMET_API_KEY=${{ secrets.REDEMET_API_KEY }}
          VITE_INMET_TOKEN=${{ secrets.INMET_TOKEN }}
          EOF

      - name: Escrever credentials.json no servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/credentials && chmod 700 $DEPLOY_PATH/credentials"
          echo "${{ secrets.GCP_CREDENTIALS_JSON_B64 }}" | base64 -d | ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "cat > $DEPLOY_PATH/credentials/credentials.json"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 $DEPLOY_PATH/credentials/credentials.json"

      - name: Instalar dependências, build e (re)iniciar serviço
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_PATH/deploy/remote-setup.sh"
